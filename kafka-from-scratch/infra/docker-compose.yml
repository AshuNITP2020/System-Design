# Single-broker KRaft cluster + a live web console.
# Used by stages 4, 5, 7, 8. For stage 6 (replication) use docker-compose.cluster.yml.
#
#   docker compose -f infra/docker-compose.yml up -d
#   open http://localhost:8081
#
# No ZooKeeper anywhere in this file. That absence is the whole content of
# kraft-vs-zookeeper.html — this one container is broker AND controller
# (KAFKA_PROCESS_ROLES below), which is why there is no second service to run.
name: kafkalab

services:
  kafka1:
    image: apache/kafka:4.0.0
    container_name: kafkalab-kafka1
    ports:
      - "9092:9092"          # your Java clients connect here
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller

      # Three listeners, three different jobs. Worth understanding once:
      #   INTERNAL   - broker-to-broker and container-to-container (kafka-ui uses this)
      #   HOST       - your Java client on the laptop, via the mapped port above
      #   CONTROLLER - the KRaft metadata quorum. In ZooKeeper-era Kafka this did not exist.
      KAFKA_LISTENERS: INTERNAL://:19092,HOST://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka1:19092,HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka1:29093

      # One broker means nothing can be replicated. Every RF here is 1 by necessity.
      # Stage 6 is where these become 3 and the numbers start to matter.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      # Deliberate teaching choices:
      #   rebalance delay 0  -> group rebalances are instant, so stage 5 is observable
      #   auto-create off    -> you must state a partition count out loud, every time
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

      # Explicit log dir on a named volume, so segments survive `down.sh` and only
      # `down.sh --wipe` destroys them. Stage 8 (retention) needs data that outlives a restart.
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 15s

  kafka-ui:
    image: kafbat/kafka-ui:latest
    container_name: kafkalab-ui
    ports:
      - "8081:8080"          # 8080 is taken by your own order-service
    environment:
      KAFKA_CLUSTERS_0_NAME: kafkalab
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka1:19092
      DYNAMIC_CONFIG_ENABLED: "true"
      SERVER_SERVLET_CONTEXT_PATH: /
    depends_on:
      kafka1:
        condition: service_healthy

volumes:
  kafka1-data:
