# ============================================================================
# SPRING BOOT APPLICATION CONFIGURATION
# ============================================================================
# 
# This single file replaces multiple XML configuration files from Spring Framework era!
# 
# In Spring Framework, you needed:
# - applicationContext.xml
# - spring-mvc.xml
# - web.xml
# - database-context.xml
# - And more...
#
# In Spring Boot, just this file!
# ============================================================================

# ============================================================================
# SERVER CONFIGURATION
# ============================================================================
# The embedded Tomcat is configured here - no external server needed!
server.port=8080

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
# H2 is an in-memory database perfect for learning
# Data is lost when application restarts (unless you use file mode)

# Database URL - "mem" means in-memory, "bookdb" is the database name
spring.datasource.url=jdbc:h2:mem:bookdb

# H2 driver class
spring.datasource.driver-class-name=org.h2.Driver

# Default credentials for H2
spring.datasource.username=sa
spring.datasource.password=

# ============================================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================================

# DDL strategy:
# - create: Drop and create tables on startup
# - create-drop: Create on startup, drop on shutdown
# - update: Update schema if needed
# - validate: Just validate, don't modify
# - none: Do nothing
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console (useful for learning)
spring.jpa.show-sql=true

# Format SQL for readability
spring.jpa.properties.hibernate.format_sql=true

# Database dialect
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ============================================================================
# H2 CONSOLE (Web-based database viewer)
# ============================================================================
# Enable the H2 web console
spring.h2.console.enabled=true

# Console path
spring.h2.console.path=/h2-console

# Allow access from any host (only for development!)
spring.h2.console.settings.web-allow-others=false

# ============================================================================
# LOGGING CONFIGURATION
# ============================================================================
# Log levels: TRACE, DEBUG, INFO, WARN, ERROR

# Root log level
logging.level.root=INFO

# Spring framework logging
logging.level.org.springframework=INFO

# Hibernate SQL logging
logging.level.org.hibernate.SQL=DEBUG

# Show parameter values in SQL (WARNING: may expose sensitive data in logs!)
# logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE

# Our application logging
logging.level.com.learning=DEBUG

# ============================================================================
# SPRING BOOT BANNER
# ============================================================================
# Disable the Spring banner in console
# spring.main.banner-mode=off

# ============================================================================
# COMPARISON: application.properties vs XML Configuration
# ============================================================================
#
# SPRING FRAMEWORK (XML):
# 
# <bean id="dataSource" class="org.apache.commons.dbcp.BasicDataSource">
#     <property name="driverClassName" value="org.h2.Driver"/>
#     <property name="url" value="jdbc:h2:mem:bookdb"/>
#     <property name="username" value="sa"/>
#     <property name="password" value=""/>
#     <property name="maxActive" value="10"/>
#     <property name="maxIdle" value="5"/>
# </bean>
# 
# <bean id="sessionFactory" class="org.springframework.orm.hibernate4.LocalSessionFactoryBean">
#     <property name="dataSource" ref="dataSource"/>
#     <property name="hibernateProperties">
#         <props>
#             <prop key="hibernate.dialect">org.hibernate.dialect.H2Dialect</prop>
#             <prop key="hibernate.show_sql">true</prop>
#             <prop key="hibernate.format_sql">true</prop>
#             <prop key="hibernate.hbm2ddl.auto">create-drop</prop>
#         </props>
#     </property>
# </bean>
#
# SPRING BOOT (this file):
# Just 4 lines for the same configuration!
# spring.datasource.url=jdbc:h2:mem:bookdb
# spring.jpa.hibernate.ddl-auto=create-drop
# spring.jpa.show-sql=true
# spring.jpa.properties.hibernate.format_sql=true
# ============================================================================

