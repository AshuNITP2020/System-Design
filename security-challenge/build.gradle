plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.4'  // Match root project version
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.challenge'
version = '1.0.0'

java {
    sourceCompatibility = '17'
}

repositories {
    mavenCentral()
}

dependencies {
    // Spring Boot Starters
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // TODO: Uncomment Spring Security when you start implementing security
    // implementation 'org.springframework.boot:spring-boot-starter-security'

    // TODO: Uncomment JWT dependencies when implementing JWT authentication
    // implementation 'io.jsonwebtoken:jjwt-api:0.12.3'
    // runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.3'
    // runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.3'

    // H2 Database for development
    runtimeOnly 'com.h2database:h2'

    // Test Dependencies
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

