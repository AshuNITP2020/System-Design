# Database Configuration (H2 for development)
spring.datasource.url=jdbc:h2:mem:securitychallenge
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA Configuration
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (for debugging)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Server Configuration
server.port=8080

# JWT Configuration
# IMPORTANT: In production, use a strong, randomly generated secret key (at least 256 bits)
# Generate a secure key: openssl rand -base64 32
jwt.secret=mySecretKeyForJWTTokenGenerationAndValidationMustBeAtLeast256BitsLongForSecurity
jwt.expiration=86400000

